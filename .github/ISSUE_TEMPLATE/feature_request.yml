name: Feature request
description: Suggest a capability or behaviour change.
title: "[Feature] "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        This viewer is deliberately narrow: open media fast, navigate neighbours fast, keep dense
        fullscreen layouts smooth. It is not a photo manager, editor, or cataloger — see the
        non-goals in ARCHITECTURE.md §1 before proposing indexing, library, or editing features.

  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight
      options:
        - label: I searched existing issues and discussions for this idea.
          required: true
        - label: This does not conflict with a listed non-goal.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you unable to do today? Describe the workflow, not the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Existing keys/settings, another tool, or a manual workaround.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Window / fullscreen / controls
        - Navigation / sorting
        - "Layout: Long Strip"
        - "Layout: Masonry"
        - Video playback
        - Animated images
        - Stash window
        - Settings / config.ini
        - File operations / undo
        - Cache / performance
        - Startup / installer / CLI
        - Other
  - type: dropdown
    id: scale
    attributes:
      label: Expected scope
      options:
        - Small (a key, a setting, a fix in one subsystem)
        - Medium (new window/panel or a new pipeline)
        - Large (new layout/mode touching the frame path)
        - Unknown
  - type: checkboxes
    id: perf
    attributes:
      label: Performance impact
      description: Anything that adds work to the UI thread frame path needs justification.
      options:
        - label: This can work without extra per-frame work (event-driven only).
        - label: This needs work in the frame path; I accept it may be rejected or redesigned.
        - label: This needs extra memory or VRAM (describe the budget below).
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Mockups, keybinding suggestions, related issues, prior art in other viewers.
