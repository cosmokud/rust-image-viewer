name: Performance issue
description: Slowness, stutter, dropped frames, slow folder open, growing RAM/VRAM.
title: "[Perf] "
labels: ["performance", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Performance reports need numbers. If you can, turn on the diagnostics overlay
        (`show_fps = true` in `config.ini`, labels are defined in `docs/diagnostics.md`) and
        capture a screenshot at the moment of the problem, plus the `RIV_DIAG` log.

  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight
      options:
        - label: I am on the latest release (pre-1.0.0, older releases are unsupported).
          required: true
        - label: I checked whether a persistent metadata cache had already warmed this folder.
          required: true

  - type: dropdown
    id: symptom
    attributes:
      label: Symptom
      options:
        - Slow first open of a folder
        - Slow navigation to the next/previous file
        - Stutter while scrolling Long Strip
        - Stutter while scrolling Masonry
        - Low FPS / dropped frames in video playback
        - CPU or GPU pegged at idle
        - RAM or VRAM keeps growing (leak)
        - UI stalls / window unresponsive
        - Slow startup or shutdown
  - type: dropdown
    id: build
    attributes:
      label: Build variant
      options:
        - AVX2 (default)
        - Legacy SSE4.2
        - Built from source
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: e.g. 0.4.4
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: CPU / GPU / RAM / storage
      placeholder: e.g. i7-9700K, RTX 3070, 32 GB, NVMe
    validations:
      required: true
  - type: input
    id: display
    attributes:
      label: Resolution and DPI scale
      placeholder: e.g. 2560x1440 @ 150%
  - type: textarea
    id: workload
    attributes:
      label: Workload
      description: Folder size, file count, file types, average file size, cache warm or cold.
      placeholder: |
        e.g. 1200 files: 800 JPG ~3 MB, 400 PNG ~6 MB; cold cache; Masonry fullscreen.
    validations:
      required: true
  - type: textarea
    id: metrics
    attributes:
      label: Overlay metrics (copy the ones that matter)
      description: Typical culprits are `TTV p50/p95`, `UP p95`, `QW p95`, `DEC p95`, `RSZ p95`, `UTX p95`, `LY p95`, `VQ p95`, `DC H/M`, `MC ...`.
      placeholder: Paste the overlay screenshot or transcribe the lines.
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: baseline
    attributes:
      label: Comparison baseline
      placeholder: e.g. 0.4.3 was smooth with the same folder / a generic viewer shows instantly
  - type: textarea
    id: diag_log
    attributes:
      label: Diagnostics log
      description: |
        PowerShell: `$env:RIV_DIAG='1'`, reproduce, `Remove-Item Env:RIV_DIAG`.
        cmd: `set RIV_DIAG=1`, reproduce.
        Logs: `%TEMP%\rust-image-viewer\diag-<pid>-<unix_ts>.log` (override folder with
        `RIV_DIAG_DIR`). `RIV_DIAG_FRAME_MS` sets the slow-frame threshold (default 16),
        `RIV_DIAG_HANG_MS` the watchdog stall threshold (default 2000).
  - type: textarea
    id: extra
    attributes:
      label: Anything else
