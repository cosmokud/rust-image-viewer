# Third-party attribution, generated by `cargo tribute`
# (https://crates.io/crates/cargo-tribute). `cargo tribute` refreshes LICENSES/,
# NOTICES/ and THIRD-PARTY.md from the Cargo dependency tree; `cargo tribute
# --check` exits 2 when what is committed no longer matches that tree.
# The GStreamer runtime that the bundled installer ships is not a crate and so is
# not covered here: generate-attribution.ps1 appends it to THIRD-PARTY.md.
#
# Everything here is a deliberate departure from the defaults, and nothing else
# is: the accepted list below is the default one plus the three additions noted
# in it, and the entries after it are the crates those defaults do not describe
# correctly.

accepted = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "0BSD",
    "Zlib",
    "Unlicense",
    "Unicode-3.0",
    # Three the default set does not carry, all of them permissive and
    # redistributable inside an MIT-licensed binary: Boost reaches us through
    # `windows`' `clipboard-win`/`error-code`, CC0-1.0 through `hexf-parse`, and
    # `jpeg-encoder` reproduces the IJG notice for the JPEG arithmetic it ports.
    "BSL-1.0",
    "CC0-1.0",
    "IJG",
]

# MPL-2.0 is a file-level copyleft, and every crate under it arrives through
# `egui_extras`' SVG support (resvg -> usvg -> usvg-parser/usvg-tree) except
# `option-ext`, which sits under `directories`. Scoped to those crates so the
# exception stays visible instead of widening `accepted` for every dependency
# this project ever takes on.
[[exception]]
name = "option-ext"
allow = ["MPL-2.0"]

[[exception]]
name = "resvg"
allow = ["MPL-2.0"]

[[exception]]
name = "usvg"
allow = ["MPL-2.0"]

[[exception]]
name = "usvg-parser"
allow = ["MPL-2.0"]

[[exception]]
name = "usvg-tree"
allow = ["MPL-2.0"]

# `epaint_default_fonts` embeds the Ubuntu font, and declares its licence as
# `LicenseRef-UFL-1.0` -- a local name, not an SPDX id, so no text can be looked
# up for it. `Ubuntu-font-1.0` is the SPDX id for that same licence; naming it
# here is what puts the real text into LICENSES/. The OFL-1.1 half covers the
# Noto Emoji and Hack faces shipped beside it.
[[clarify]]
name = "epaint_default_fonts"
version = "0.29.1"
expression = "MIT AND OFL-1.1 AND Ubuntu-font-1.0"

[[exception]]
name = "epaint_default_fonts"
allow = ["OFL-1.1", "Ubuntu-font-1.0"]
