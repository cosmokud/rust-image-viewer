[package]
name = "rust-image-viewer"
version = "0.4.3"
edition = "2021"
authors = ["Image Viewer"]
description = "High-performance image and video viewer for Windows 10/11"
license = "MIT"
readme = "README.md"
repository = "https://github.com/cosmokud/rust-image-viewer"
homepage = "https://github.com/cosmokud/rust-image-viewer"
keywords = ["image", "video", "viewer", "egui", "gstreamer"]
categories = ["multimedia", "graphics", "gui"]
rust-version = "1.99"
build = "build.rs"

[features]
default = []
mimalloc-allocator = ["dep:mimalloc"]

[dependencies]
# GUI framework
eframe = { version = "0.29" }
egui = "0.29"
# egui_extras powers SVG/icon loaders for egui::Image::include_image usage.
egui_extras = { version = "0.29", features = ["image", "svg"] }

# Image handling
image = { version = "0.25", default-features = false, features = ["webp", "ico", "tiff"] }
zune-core = "0.5"
# `jpeg-xl` is not used for JPEG XL: no extension list in src/ accepts the format.
# zune-image 0.5's webp codec has an unconditional `use jxl_oxide::color::WhitePoint::E`
# (src/codecs/webp.rs:6 upstream), so the feature is what keeps webp compiling.
zune-image = { version = "0.5", default-features = false, features = ["jpeg", "png", "webp", "bmp", "psd", "jpeg-xl", "simd"] }
webp-animation = "0.10"
imagesize = "0.13"
fast_image_resize = "6.0"
memmap2 = "0.9"

# GIF animation support
gif = "0.14"
gif-dispose = "6.0"

# GStreamer for video playback
gstreamer = "0.23"
gstreamer-video = "0.23"
gstreamer-app = "0.23"
gstreamer-audio = "0.23"

# Concurrency & parallelism for high-performance manga mode
rayon = "1.10"
crossbeam-channel = "0.5"
crossbeam-queue = "0.3"
bytes = "1.7"
interprocess = "2.4"
parking_lot = "0.12"
lru = "0.12"
hashbrown = "0.15"
hdrhistogram = "7.5"
jwalk = "0.8"
smallvec = "1.13"
redb = "2.6"
moka = { version = "0.12", features = ["sync"] }
rstar = "0.12"
# crates.io does not currently expose a crate literally named `image-simd`.
# We alias `wide` under this name for SIMD pixel math in hot paths.
image-simd = { package = "wide", version = "0.7" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
puffin = "0.19"
tokio = { version = "1.48", features = ["rt-multi-thread", "sync", "time", "net"] }
mimalloc = { version = "0.1", optional = true }
trash = "5.2"
directories = "6.0"

# Windows-specific
[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["winuser", "wingdi", "dwmapi", "libloaderapi", "winreg", "processenv", "synchapi", "handleapi", "namedpipeapi", "fileapi", "winbase", "errhandlingapi", "winerror", "minwinbase", "shellscalingapi"] }
clipboard-win = "5.4"
# Same version eframe/winit use, so `HasWindowHandle` is the trait `CreationContext` implements.
raw-window-handle = "0.6"
windows = { version = "0.58", features = ["Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_Shell_PropertiesSystem", "Win32_System_Com", "Win32_System_Console", "Win32_Foundation", "Win32_Graphics_Gdi"] }

[build-dependencies]
# For build script to copy default config template (assets/config.ini) and embed Windows icon (.ico)
fs_extra = "1.3"
winres = "0.1"
directories = "6.0"

[package.metadata.packager]
product-name = "Rust Image Viewer"
identifier = "dev.rust-image-viewer.app"
publisher = "Rust Image Viewer Contributors"
description = "High-performance image and video viewer for Windows 10/11"
license-file = "LICENSE"
formats = ["nsis"]
out-dir = "target/packager"
binaries-dir = "target/release"
before-packaging-command = "cargo build --release"
icons = ["assets/icon.ico"]

[[package.metadata.packager.file-associations]]
extensions = ["jpg", "jpeg", "png", "webp", "gif", "bmp", "psd", "ico", "tiff", "tif"]
description = "Image File"
name = "RustImageViewer.Image"

[[package.metadata.packager.file-associations]]
extensions = ["mp4", "mkv", "webm", "avi", "mov", "wmv", "flv", "m4v", "3gp", "ogv"]
description = "Video File"
name = "RustImageViewer.Video"

[package.metadata.packager.nsis]
install-mode = "currentUser"
template = "packaging/nsis/installer.nsi"
appdata-paths = ["$APPDATA/rust-image-viewer", "$LOCALAPPDATA/rust-image-viewer"]
preinstall-section = '''
; Keep current-user install path at AppData\Local\rust-image-viewer instead of product display name.
Section PreInstallPathOverride
  !if "${INSTALLMODE}" == "currentUser"
    StrCmp $INSTDIR "$LOCALAPPDATA\${PRODUCTNAME}" 0 +2
    StrCpy $INSTDIR "$LOCALAPPDATA\rust-image-viewer"
  !endif
SectionEnd
'''

[profile.release]
opt-level = 3
lto = true
# Fat LTO merges every crate's bitcode into one module and optimizes *that*, so the codegen
# units spent before it reaches the merged module are invisible in the shipped binary: the
# output is still one module, optimized as one. Only the pre-LTO pass widens.
#
# Measured here (16 threads, one crate rebuilt and relinked, `-Z time-passes`): at
# codegen-units = 1 the pre-LTO LLVM pass is 90s of a 162s rustc; at 16 it is 8s of 130s,
# and the rest is LLVM_fatlto (117s, one thread) plus 0.3s of linking. It also applies to
# every dependency, where 1 turned 427 parallel compilations into 427 serial ones.
#
# This is the profile CI ships, and the only one it ships: the instruction set an artifact is
# built for is not part of a profile, so it comes from `-C target-cpu` in `.cargo/config.toml`
# (AVX2) and from `RUSTFLAGS` in `build-installers.ps1` for the legacy set built beside it. A
# workstation gets a 35s rebuild instead of 2m06s from `git config riv.releaseLto thin`, which
# writes the machine-local lto = "thin" that .cargo/config.toml includes; nothing about that
# file reaches a clone or a runner.
codegen-units = 16
panic = "abort"
strip = true

# `build.rs`, build scripts and proc-macros run while the crate is compiled and none of
# their code ships, so release's opt-level 3 is paid for nothing.
[profile.release.build-override]
opt-level = 1
codegen-units = 16

# Debug profile optimizations - reduce memory usage during development too
[profile.dev]
opt-level = 1

# Use thin LTO for faster builds with good optimization
[profile.release-fast]
inherits = "release"
lto = "thin"
codegen-units = 4

[[bin]]
name = "rust-image-viewer"
path = "src/main.rs"
